{% extends "base.html" %}
{% block title %}{{ title }} · {% endblock %}

{% block content %}
<div class="container narrow">
  <section class="error-page">
    <div class="error-page__emoji" aria-hidden="true">{{ {400: '🧐', 403: '🔒', 404: '🗺️', 413: '📦', 500: '🛠️'}.get(code, '🙈') }}</div>
    <p class="eyebrow script">error {{ code }}</p>
    <h1>{{ title }}</h1>
    <p class="lead">{{ message }}</p>
    <p>
      <a class="btn btn-primary" href="{{ url_for('main.index') }}">Take me home</a>
      <a class="btn btn-secondary" href="{{ url_for('main.index') }}" data-back>Go back</a>
    </p>
  </section>
</div>
{% endblock %}
